<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kaifa X — Crypto Tracker</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;500;700;800&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0A0A0B;
      --surface: #111114;
      --border: #222226;
      --text: #F0EDE8;
      --muted: #666;
      --dim: #333;
      --amber: #F5A623;
      --green: #22C55E;
      --red: #EF4444;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', system-ui, sans-serif;
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 32px;
      border-bottom: 0.5px solid var(--border);
      position: sticky;
      top: 0;
      background: rgba(10,10,11,0.92);
      backdrop-filter: blur(12px);
      z-index: 10;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .logo span { color: var(--amber); }

    .market-status {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* ── MAIN ── */
    main { max-width: 1100px; margin: 0 auto; padding: 32px 24px 80px; }

    /* ── STATS ROW ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: 14px;
      padding: 18px 20px;
    }
    .stat-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
      font-family: 'DM Mono', monospace;
    }
    .stat-value {
      font-family: 'Syne', sans-serif;
      font-size: 22px;
      font-weight: 700;
    }
    .stat-sub { font-size: 12px; margin-top: 4px; font-family: 'DM Mono', monospace; }
    .up { color: var(--green); }
    .down { color: var(--red); }

    /* ── TABS ── */
    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 24px;
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: 12px;
      padding: 4px;
      width: fit-content;
    }
    .tab {
      padding: 8px 22px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--muted);
      transition: all 0.2s;
      font-family: 'DM Sans', sans-serif;
    }
    .tab.active { background: var(--amber); color: #0A0A0B; }
    .tab:hover:not(.active) { color: var(--text); }

    /* ── TABLE ── */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .search-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: 10px;
      padding: 9px 14px;
      width: 240px;
    }
    .search-bar input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      width: 100%;
    }
    .search-bar input::placeholder { color: #444; }

    .coin-table { width: 100%; border-collapse: collapse; }
    .coin-table th {
      text-align: left;
      font-size: 11px;
      color: #555;
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      padding: 8px 12px;
      border-bottom: 0.5px solid #1A1A1E;
    }
    .coin-table th:not(:first-child) { text-align: right; }

    .coin-row { border-bottom: 0.5px solid #111114; cursor: pointer; transition: background 0.15s; }
    .coin-row:hover { background: var(--surface); }
    .coin-row td { padding: 15px 12px; vertical-align: middle; }
    .coin-row td:not(:first-child) { text-align: right; }

    .coin-meta { display: flex; align-items: center; gap: 10px; }
    .coin-icon {
      width: 36px; height: 36px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700;
      font-family: 'Syne', sans-serif;
      flex-shrink: 0;
    }
    .coin-name { font-weight: 500; font-size: 14px; }
    .coin-sym { font-size: 11px; color: #555; font-family: 'DM Mono', monospace; margin-top: 1px; }
    .price { font-family: 'DM Mono', monospace; font-size: 14px; font-weight: 500; }
    .change-badge {
      display: inline-flex; align-items: center; gap: 3px;
      padding: 3px 9px; border-radius: 6px;
      font-size: 12px; font-weight: 500;
      font-family: 'DM Mono', monospace;
    }
    .change-badge.up   { background: rgba(34,197,94,0.12);  color: var(--green); }
    .change-badge.down { background: rgba(239,68,68,0.12);   color: var(--red);   }
    .mcap { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); }
    .rank-num { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--dim); }

    /* ── CHART PANEL ── */
    .chart-section {
      margin-top: 28px;
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: 16px;
      padding: 22px;
    }
    .chart-header {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .chart-title { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; }
    .timeframes { display: flex; gap: 2px; }
    .tf-btn {
      padding: 5px 12px; border-radius: 7px; font-size: 11px;
      cursor: pointer; border: none; background: transparent;
      color: #555; font-family: 'DM Mono', monospace; transition: all 0.2s;
    }
    .tf-btn.active { background: rgba(245,166,35,0.15); color: var(--amber); }
    .tf-btn:hover:not(.active) { color: var(--text); }

    /* ── PORTFOLIO ── */
    .portfolio-total {
      background: var(--surface);
      border: 0.5px solid #2A2510;
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 20px;
    }
    .portfolio-label {
      font-size: 11px; text-transform: uppercase;
      letter-spacing: 0.8px; color: var(--muted);
      font-family: 'DM Mono', monospace; margin-bottom: 8px;
    }
    .portfolio-value {
      font-family: 'Syne', sans-serif;
      font-size: 40px; font-weight: 800; margin-bottom: 6px;
    }
    .portfolio-coins { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .portfolio-coin-card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: 14px; padding: 16px;
    }
    .pcoin-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .pcoin-amount { font-size: 12px; color: var(--muted); margin-bottom: 2px; font-family: 'DM Mono', monospace; }
    .pcoin-value { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; }
    .bar-wrap { height: 3px; background: #1A1A1E; border-radius: 2px; margin-top: 12px; overflow: hidden; }
    .bar-fill  { height: 100%; border-radius: 2px; }

    /* ── RESPONSIVE ── */
    @media (max-width: 640px) {
      header { padding: 16px 18px; }
      main   { padding: 20px 16px 60px; }
      .stats-row { grid-template-columns: 1fr; }
      .portfolio-coins { grid-template-columns: 1fr; }
      .coin-table th:nth-child(5),
      .coin-table td:nth-child(5),
      .coin-table th:nth-child(6),
      .coin-table td:nth-child(6) { display: none; }
      .portfolio-value { font-size: 28px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">KAIFA <span>X</span></div>
  <div class="market-status">
    <div class="dot"></div>
    MARKET LIVE
  </div>
</header>

<main>
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">Total Mkt Cap</div>
      <div class="stat-value">$2.41T</div>
      <div class="stat-sub up">▲ 3.2% today</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">24h Volume</div>
      <div class="stat-value">$98.7B</div>
      <div class="stat-sub up">▲ 11.4% vs avg</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">BTC Dominance</div>
      <div class="stat-value">54.2%</div>
      <div class="stat-sub down">▼ 0.6% this week</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('market')">Market</button>
    <button class="tab" onclick="switchTab('portfolio')">Portfolio</button>
  </div>

  <!-- MARKET -->
  <div id="market-section">
    <div class="top-bar">
      <div class="search-bar">
        <span style="color:#444;font-size:15px">⌕</span>
        <input type="text" placeholder="Search coins..." id="searchInput" oninput="filterCoins()" />
      </div>
      <div style="font-size:12px;color:#444;font-family:'DM Mono',monospace" id="coinCount">10 assets</div>
    </div>

    <table class="coin-table">
      <thead>
        <tr>
          <th style="width:28px">#</th>
          <th>Asset</th>
          <th>Price</th>
          <th>24h</th>
          <th>7d</th>
          <th>Mkt Cap</th>
        </tr>
      </thead>
      <tbody id="coinTableBody"></tbody>
    </table>

    <div class="chart-section">
      <div class="chart-header">
        <div class="chart-title" id="selectedCoinTitle">BTC / USD — Price Chart</div>
        <div class="timeframes">
          <button class="tf-btn active" onclick="setTf(this,'1D')">1D</button>
          <button class="tf-btn" onclick="setTf(this,'1W')">1W</button>
          <button class="tf-btn" onclick="setTf(this,'1M')">1M</button>
          <button class="tf-btn" onclick="setTf(this,'3M')">3M</button>
        </div>
      </div>
      <div style="position:relative;height:220px">
        <canvas id="mainChart"></canvas>
      </div>
    </div>
  </div>

  <!-- PORTFOLIO -->
  <div id="portfolio-section" style="display:none">
    <div class="portfolio-total">
      <div class="portfolio-label">Total Portfolio Value</div>
      <div class="portfolio-value">$47,284.92</div>
      <div class="stat-sub up" style="font-size:14px">▲ +$1,432.50 today (3.12%)</div>
    </div>
    <div class="portfolio-coins" id="portfolioCoins"></div>
  </div>
</main>

<script>
var coins = [
  { rank:1,  sym:'BTC',  name:'Bitcoin',   price:67420,  change24:2.84,  change7:9.2,   mcap:'$1.33T', color:'#F7931A', bg:'rgba(247,147,26,0.15)' },
  { rank:2,  sym:'ETH',  name:'Ethereum',  price:3512,   change24:1.92,  change7:6.1,   mcap:'$421B',  color:'#627EEA', bg:'rgba(98,126,234,0.15)' },
  { rank:3,  sym:'BNB',  name:'BNB',       price:598,    change24:-0.73, change7:2.4,   mcap:'$87B',   color:'#F3BA2F', bg:'rgba(243,186,47,0.15)' },
  { rank:4,  sym:'SOL',  name:'Solana',    price:172,    change24:5.61,  change7:14.8,  mcap:'$80B',   color:'#9945FF', bg:'rgba(153,69,255,0.15)' },
  { rank:5,  sym:'XRP',  name:'XRP',       price:0.621,  change24:-1.14, change7:-3.2,  mcap:'$34B',   color:'#00B4E4', bg:'rgba(0,180,228,0.15)'  },
  { rank:6,  sym:'ADA',  name:'Cardano',   price:0.463,  change24:0.88,  change7:1.9,   mcap:'$16B',   color:'#4B8FE2', bg:'rgba(75,143,226,0.15)' },
  { rank:7,  sym:'AVAX', name:'Avalanche', price:38.20,  change24:3.22,  change7:7.5,   mcap:'$15B',   color:'#E84142', bg:'rgba(232,65,66,0.15)'  },
  { rank:8,  sym:'DOGE', name:'Dogecoin',  price:0.159,  change24:7.41,  change7:22.3,  mcap:'$23B',   color:'#C3A634', bg:'rgba(195,166,52,0.15)' },
  { rank:9,  sym:'DOT',  name:'Polkadot',  price:8.74,   change24:-2.10, change7:-5.8,  mcap:'$11B',   color:'#E6007A', bg:'rgba(230,0,122,0.15)'  },
  { rank:10, sym:'LINK', name:'Chainlink', price:17.80,  change24:4.38,  change7:11.2,  mcap:'$10B',   color:'#2A5ADA', bg:'rgba(42,90,218,0.15)'  }
];

function genSpark(base, trend, n) {
  var pts = [], v = base * 0.92;
  for (var i = 0; i < n; i++) {
    v += v * (trend / 100 / n) + (Math.random() - 0.48) * v * 0.018;
    pts.push(+v.toFixed(8));
  }
  pts[pts.length - 1] = base;
  return pts;
}
coins.forEach(function(c) { c.spark = genSpark(c.price, c.change7, 28); });

var portfolio = [
  { sym:'BTC',  amount:0.42,   coin: coins[0] },
  { sym:'ETH',  amount:5.8,    coin: coins[1] },
  { sym:'SOL',  amount:45,     coin: coins[3] },
  { sym:'DOGE', amount:12000,  coin: coins[7] }
];

function fmt(n) {
  if (n >= 1e12) return '$' + (n/1e12).toFixed(2) + 'T';
  if (n >= 1e9)  return '$' + (n/1e9).toFixed(2)  + 'B';
  if (n >= 1e6)  return '$' + (n/1e6).toFixed(2)  + 'M';
  if (n >= 1000) return '$' + n.toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2});
  return '$' + n.toFixed(n < 1 ? 4 : 2);
}

function miniSparkSVG(data, isUp) {
  var w = 64, h = 28;
  var min = Math.min.apply(null,data), max = Math.max.apply(null,data);
  var range = max - min || 1;
  var pts = data.map(function(v,i){
    return ((i/(data.length-1))*w).toFixed(1)+','+(h-((v-min)/range)*(h-2)-1).toFixed(1);
  }).join(' ');
  var col = isUp ? '#22C55E' : '#EF4444';
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" style="display:inline-block;vertical-align:middle"><polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

var filteredCoins = coins.slice();
var selectedCoin  = coins[0];
var currentTf     = '1D';
var mainChartInst = null;

function renderTable() {
  var tbody = document.getElementById('coinTableBody');
  tbody.innerHTML = '';
  filteredCoins.forEach(function(c) {
    var up24 = c.change24 >= 0, up7 = c.change7 >= 0;
    var tr = document.createElement('tr');
    tr.className = 'coin-row';
    tr.onclick = (function(coin){ return function(){ selectCoin(coin); }; })(c);
    tr.innerHTML =
      '<td><span class="rank-num">'+c.rank+'</span></td>'+
      '<td><div class="coin-meta">'+
        '<div class="coin-icon" style="background:'+c.bg+';color:'+c.color+'">'+c.sym.slice(0,2)+'</div>'+
        '<div><div class="coin-name">'+c.name+'</div><div class="coin-sym">'+c.sym+'</div></div>'+
      '</div></td>'+
      '<td><span class="price">'+fmt(c.price)+'</span></td>'+
      '<td><span class="change-badge '+(up24?'up':'down')+'">'+(up24?'▲':'▼')+' '+Math.abs(c.change24).toFixed(2)+'%</span></td>'+
      '<td>'+miniSparkSVG(c.spark,up7)+'</td>'+
      '<td><span class="mcap">'+c.mcap+'</span></td>';
    tbody.appendChild(tr);
  });
  document.getElementById('coinCount').textContent = filteredCoins.length + ' assets';
}

function filterCoins() {
  var q = document.getElementById('searchInput').value.toLowerCase();
  filteredCoins = coins.filter(function(c){
    return c.name.toLowerCase().indexOf(q)>=0 || c.sym.toLowerCase().indexOf(q)>=0;
  });
  renderTable();
}

function selectCoin(c) {
  selectedCoin = c;
  document.getElementById('selectedCoinTitle').textContent = c.sym + ' / USD — Price Chart';
  buildMainChart();
}

function genMainData(coin, tf) {
  var n = {'1D':48,'1W':84,'1M':90,'3M':90}[tf];
  var trend = {'1D':coin.change24,'1W':coin.change7,'1M':coin.change7*3,'3M':coin.change7*8}[tf];
  return genSpark(coin.price, trend, n);
}

function buildMainChart() {
  var canvas = document.getElementById('mainChart');
  var ctx = canvas.getContext('2d');
  if (mainChartInst) { mainChartInst.destroy(); mainChartInst = null; }
  var data = genMainData(selectedCoin, currentTf);
  var isUp = data[data.length-1] >= data[0];
  var col  = isUp ? '#22C55E' : '#EF4444';
  var grad = ctx.createLinearGradient(0,0,0,220);
  grad.addColorStop(0, isUp ? 'rgba(34,197,94,0.18)' : 'rgba(239,68,68,0.18)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  mainChartInst = new Chart(ctx, {
    type: 'line',
    data: {
      labels: data.map(function(_,i){ return i; }),
      datasets: [{ data:data, borderColor:col, borderWidth:1.5, backgroundColor:grad, fill:true, pointRadius:0, tension:0.3 }]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      plugins: {
        legend: { display:false },
        tooltip: {
          mode:'index', intersect:false,
          backgroundColor:'#111114', borderColor:'#222226', borderWidth:1,
          titleColor:'#666', bodyColor:'#F0EDE8', padding:10,
          callbacks: { label: function(ctx){ return fmt(ctx.raw); } }
        }
      },
      scales: {
        x: { display:false },
        y: {
          display:true, position:'right',
          grid: { color:'rgba(255,255,255,0.04)' },
          ticks: { color:'#444', font:{size:10}, callback: function(v){ return fmt(v); } }
        }
      }
    }
  });
}

function setTf(btn, tf) {
  document.querySelectorAll('.tf-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  currentTf = tf;
  buildMainChart();
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(function(t,i){
    t.classList.toggle('active', (i===0&&tab==='market')||(i===1&&tab==='portfolio'));
  });
  document.getElementById('market-section').style.display    = tab==='market'    ? 'block' : 'none';
  document.getElementById('portfolio-section').style.display = tab==='portfolio' ? 'block' : 'none';
}

function renderPortfolio() {
  var pcts = [0.605, 0.26, 0.099, 0.036];
  var el = document.getElementById('portfolioCoins');
  el.innerHTML = '';
  portfolio.forEach(function(p, i) {
    var val = p.amount * p.coin.price;
    var pct = (pcts[i]*100).toFixed(1);
    var up  = p.coin.change24 >= 0;
    var card = document.createElement('div');
    card.className = 'portfolio-coin-card';
    card.innerHTML =
      '<div class="pcoin-top">'+
        '<div class="coin-meta">'+
          '<div class="coin-icon" style="background:'+p.coin.bg+';color:'+p.coin.color+';width:30px;height:30px;font-size:11px">'+p.sym.slice(0,2)+'</div>'+
          '<div><div class="coin-name" style="font-size:13px">'+p.sym+'</div><div class="coin-sym">'+p.amount+' '+p.sym+'</div></div>'+
        '</div>'+
        '<span class="change-badge '+(up?'up':'down')+'" style="font-size:11px">'+(up?'▲':'▼')+' '+Math.abs(p.coin.change24).toFixed(1)+'%</span>'+
      '</div>'+
      '<div class="pcoin-amount">'+pct+'% of portfolio</div>'+
      '<div class="pcoin-value">'+fmt(val)+'</div>'+
      '<div class="bar-wrap"><div class="bar-fill" style="width:'+pct+'%;background:'+p.coin.color+'"></div></div>';
    el.appendChild(card);
  });
}

renderTable();
renderPortfolio();
buildMainChart();

setInterval(function() {
  coins.forEach(function(c) {
    var delta = (Math.random()-0.49) * c.price * 0.0008;
    c.price = Math.max(0.001, +(c.price+delta).toFixed(8));
    c.spark.push(c.price);
    if (c.spark.length > 28) c.spark.shift();
  });
  renderTable();
}, 3000);
</script>
</body>
</html>
